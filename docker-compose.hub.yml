services:
  magpie:
    image: thefilthycount/magpie:latest
    container_name: magpie
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAS_IP:?Set NAS_IP in .env}:9080:9080"
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${PICTURES_PATH:-./downloads/pictures}:/downloads/pictures
      - ${MODELS_PATH:-./downloads/models}:/downloads/models
      - ${OTHER_PATH:-./downloads/other}:/downloads/other
      # Optional dedicated staging mount; select /in-progress in Download engine settings.
      # - ${IN_PROGRESS_PATH:-./downloads/in-progress}:/in-progress
    environment:
      TZ: Europe/London
      MAGPIE_DOWNLOAD_ROOTS: ${MAGPIE_DOWNLOAD_ROOTS:-/downloads/pictures:/downloads/models:/downloads/other}
      MAGPIE_ALLOWED_HOSTS: "${NAS_IP},localhost,127.0.0.1"
      MAGPIE_SECURE_COOKIES: "${MAGPIE_SECURE_COOKIES:-false}"
      MAGPIE_JOB_TIMEOUT: "86400"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1g

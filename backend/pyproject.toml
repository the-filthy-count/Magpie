[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "magpie-nas"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.1", "uvicorn==0.54.0", "gallery-dl==1.32.17", "yt-dlp==2026.8.19", "yt-dlp-ejs==0.8.0", "python-multipart==0.0.32"]
[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["app*"]
